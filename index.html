    <!-- Supressão segura de erros de conexão Vite HMR WebSocket em ambiente de iframe / cloud -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        function isIgnorableWebSocketError(msg) {
          if (!msg || typeof msg !== 'string') return false;
          var lower = msg.toLowerCase();
          return lower.indexOf('websocket') !== -1 ||
                 lower.indexOf('vite') !== -1 ||
                 lower.indexOf('closed without opened') !== -1 ||
                 lower.indexOf('closed without opening') !== -1 ||
                 lower.indexOf('failed to connect to websocket') !== -1;
        }

        // 1. Intercepta e previne Unhandled Rejections e Erros de WebSocket / Vite globalmente
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason || event);
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isIgnorableWebSocketError(msg)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
          if (isIgnorableWebSocketError(msg)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
        
        // 2. Silencia avisos e erros conhecidos de WebSocket do Vite no console
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function() {
          var msg = Array.prototype.join.call(arguments, ' ');
          if (isIgnorableWebSocketError(msg) || msg.indexOf('[vite] connecting...') !== -1) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
        console.error = function() {
          var msg = Array.prototype.join.call(arguments, ' ');
          if (isIgnorableWebSocketError(msg)) {
            return;
          }
          return origError.apply(console, arguments);
        };

        // 3. Mock transparente para conexões HMR do Vite (evita falha de socket e rejeição de Promise)
        if (window.WebSocket) {
          var NativeWebSocket = window.WebSocket;

          function createDummyHmrSocket(url, protocols) {
            var listeners = {};
            var dummy = {
              url: url,
              protocol: protocols || 'vite-hmr',
              readyState: 1, // OPEN
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
              addEventListener: function(type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
              },
              removeEventListener: function(type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
              },
              dispatchEvent: function(event) {
                var type = event && event.type;
                var cbs = listeners[type] || [];
                for (var i = 0; i < cbs.length; i++) {
                  try { cbs[i].call(dummy, event); } catch(e) {}
                }
                return true;
              },
              send: function() {},
              close: function() {
                dummy.readyState = 3;
              }
            };

            setTimeout(function() {
              try {
                var evt = new Event('open');
                if (typeof dummy.onopen === 'function') dummy.onopen(evt);
                dummy.dispatchEvent(evt);
              } catch(e) {}
            }, 10);

            return dummy;
          }

          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = (
              urlStr.indexOf('vite') !== -1 || 
              urlStr.indexOf(':24678') !== -1 ||
              urlStr.indexOf(window.location.host) !== -1 ||
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)
            );

            if (isViteHmr) {
              return createDummyHmrSocket(urlStr, protocols);
            }

            try {
              return new NativeWebSocket(url, protocols);
            } catch (err) {
              return createDummyHmrSocket(urlStr, protocols);
            }
          };

          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
